name: corpusforge

x-backend-env: &backend-env
  APP_NAME: CorpusForge
  APP_ENV: development
  DEBUG: "true"
  SECRET_KEY: ${SECRET_KEY:-dev-only-change-me}
  API_V1_PREFIX: /api/v1
  CORS_ORIGINS: http://localhost:3000
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: corpusforge
  POSTGRES_PASSWORD: corpusforge
  POSTGRES_DB: corpusforge
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  CELERY_WORKER_CONCURRENCY: "2"
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: corpusforge
  S3_REGION: us-east-1
  QDRANT_URL: http://qdrant:6333
  MAX_UPLOAD_SIZE_BYTES: "52428800"

x-backend-build: &backend-build
  context: ./backend
  dockerfile: Dockerfile

services:
  postgres:
    # Host 5433 avoids clashing with other local Postgres containers.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corpusforge
      POSTGRES_PASSWORD: corpusforge
      POSTGRES_DB: corpusforge
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpusforge -d corpusforge"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    # Host 6380 avoids clashing with other local Redis containers.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        i=0
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          i=$$((i+1))
          if [ $$i -gt 30 ]; then
            echo "minio is not reachable"
            exit 1
          fi
          sleep 1
        done
        mc mb --ignore-existing local/corpusforge

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"OK\\|ready\" <&3 || exit 0'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    build: *backend-build
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build: *backend-build
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    restart: unless-stopped

  worker:
    build: *backend-build
    environment:
      <<: *backend-env
    volumes:
      - ./backend/app:/app/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command:
      [
        "celery",
        "-A",
        "app.workers.celery_app:celery_app",
        "worker",
        "--loglevel=info",
        "--concurrency=2",
        "-Q",
        "default,ingestion,embedding,indexing",
      ]
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
