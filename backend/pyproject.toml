[project]
name = "corpusforge"
version = "0.1.0"
description = "Production-oriented multi-source RAG platform for ingesting, synchronizing, indexing, retrieving, and evaluating organizational knowledge."
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CorpusForge" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "celery[redis]>=5.4.0",
    "redis>=5.2.0",
    "minio>=7.2.0",
    "qdrant-client>=1.12.0",
    "structlog>=24.4.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires running infrastructure (postgres, redis, minio, qdrant)",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::DeprecationWarning:starlette.testclient",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = false
packages = ["app"]

[[tool.mypy.overrides]]
module = [
    "minio",
    "minio.*",
    "celery",
    "celery.*",
    "kombu",
    "kombu.*",
    "qdrant_client",
    "qdrant_client.*",
]
ignore_missing_imports = true
